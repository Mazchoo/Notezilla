<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg-0: #11111b;
      --bg-1: #181825;
      --bg-2: #1e1e2e;
      --bg-3: #313244;
      --border: #45475a;
      --text: #cdd6f4;
      --text-muted: #6c7086;
      --accent: #cba6f7;
    }
    /* Zero page margin so the body background fills the sheet; padding keeps text inset. */
    @page { margin: 0; }
    html, body {
      background-color: var(--bg-2);
      color: var(--text);
      margin: 0;
      padding: 72pt;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 11pt;
      line-height: 1.5;
    }
    h1, h2, h3, h4, h5, h6 { color: var(--text); }
    a { color: var(--accent); }
    hr { border: none; border-top: 1px solid var(--border); }
    p, li, td { color: var(--text); }
    .math-inline, .math-display { color: var(--text); }
    code {
      font-family: Courier, monospace;
      font-size: 0.9em;
      background: var(--bg-3);
      color: #f38ba8;
    }
    pre {
      background: var(--bg-1);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      font-size: 9pt;
    }
    pre code {
      background: transparent;
      color: inherit;
    }
    svg { max-width: 100%; }
    img { max-width: 100%; }
    table { border-collapse: collapse; }
    th, td {
      border: 1px solid var(--border);
      padding: 4px 8px;
    }
    blockquote {
      background: var(--bg-3);
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--text);
    }
    .frontmatter {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 16px;
    }
    .frontmatter h2 {
      font-size: 10pt;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 8px;
    }
    .frontmatter pre {
      background: transparent;
      color: inherit;
      border: none;
      padding: 0;
      font-size: 9pt;
    }
  </style>
</head>
<body>
{{BODY}}
</body>
</html>
