<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{TITLE}}</title>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 11pt;
      color: #1e1e2e;
      line-height: 1.5;
    }
    h1, h2, h3, h4, h5, h6 { color: #11111b; }
    a { color: #7c3aed; }
    hr { border: none; border-top: 1px solid #45475a; }
    code {
      font-family: Courier, monospace;
      font-size: 0.9em;
    }
    pre {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 10px;
      font-size: 9pt;
    }
    pre code {
      background: transparent;
      color: inherit;
    }
    svg { max-width: 100%; }
    img { max-width: 100%; }
    table { border-collapse: collapse; }
    th, td {
      border: 1px solid #45475a;
      padding: 4px 8px;
    }
    blockquote {
      border-left: 3px solid #7c3aed;
      padding-left: 12px;
      color: #45475a;
    }
    .frontmatter {
      border: 1px solid #45475a;
      padding: 8px 12px;
      margin-bottom: 16px;
    }
    .frontmatter h2 {
      font-size: 10pt;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #6c7086;
      margin: 0 0 8px;
    }
    .frontmatter pre {
      background: transparent;
      color: inherit;
      padding: 0;
      font-size: 9pt;
    }
  </style>
</head>
<body>
{{BODY}}
</body>
</html>
