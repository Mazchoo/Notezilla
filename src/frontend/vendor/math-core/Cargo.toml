[package]
edition = "2024"
rust-version = "1.96"
name = "math-core"
version = "0.9.0"
authors = [
    "Hiromu Sugiura <h.sugiura0705@outlook.com>",
    "Thomas MK <tmke8@posteo.net>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Convert LaTeX equations to MathML Core"
readme = "README.md"
keywords = [
    "latex",
    "mathml",
]
categories = ["science"]
license = "MIT"
repository = "https://github.com/tmke8/math-core"
resolver = "2"

[features]
ariadne = ["dep:ariadne"]
default = ["std"]
serde = [
    "dep:serde",
    "mathml-renderer/serde",
]
std = [
    "memchr/std",
    "phf/std",
    "strum/std",
    "mathml-renderer/std",
    "serde?/std",
]

[lib]
name = "math_core"
path = "src/lib.rs"

[dependencies.ariadne]
version = "0.6.0"
optional = true

[dependencies.hashbrown]
version = "0.17"
default-features = false

[dependencies.kstring]
version = "2.0.4"
features = [
    "unsafe",
    "max_inline",
]
default-features = false

[dependencies.mathml-renderer]
version = "0.9.0"
path = "../math-core-renderer-internal"
default-features = false
package = "math-core-renderer-internal"

[dependencies.memchr]
version = "2.8.1"
default-features = false

[dependencies.phf]
version = "0.14.0"
features = ["macros"]
default-features = false

[dependencies.rustc-hash]
version = "2.1.2"
default-features = false

[dependencies.serde]
version = "1.0.228"
features = [
    "derive",
    "alloc",
]
optional = true
default-features = false

[dependencies.static_assertions]
version = "1.1.0"

[dependencies.strum]
version = "0.28.0"
default-features = false

[dependencies.strum_macros]
version = "0.28.0"

[dev-dependencies.insta]
version = "1.47.2"
features = [
    "default",
    "ron",
]

[dev-dependencies.mathml-renderer]
version = "0.9.0"
path = "../math-core-renderer-internal"
features = ["serde"]
package = "math-core-renderer-internal"

[lints.clippy]
elidable_lifetime_names = "warn"
explicit_iter_loop = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
too_many_arguments = "allow"
trivially_copy_pass_by_ref = "warn"
unnecessary_semicolon = "warn"
