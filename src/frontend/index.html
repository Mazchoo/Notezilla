<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notezilla</title>
  <link
    data-trunk
    rel="rust"
    data-bin="notezilla-frontend"
    data-wasm-opt="4"
    data-wasm-opt-params="--converge --closed-world --zero-filled-memory --inline-functions-with-loops --traps-never-happen --strip-debug --strip-producers --enable-bulk-memory --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int --enable-multivalue --enable-reference-types --enable-simd --enable-extended-const"
  />

  <!-- Bulma 1.0 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link data-trunk rel="css" href="index.css" />
  <link data-trunk rel="copy-file" href="templates/checkbox-check.svg" data-no-hash />
</head>
<body>
  <!-- Leptos mounts into <body> via mount_to_body — no wrapper div needed.
       Mermaid (rusty-mermaid) and LaTeX math (latex2mathml → MathML) are
       pre-rendered in WASM; no JavaScript runtime or CDN scripts. -->
</body>
</html>
